name: Build Android Binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android Target NDK via SDK Manager
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: Compile Directly via Cargo
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653
          export TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang
          cargo build --release --target aarch64-linux-android --features ""

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: quartz-android-cpu
          path: target/aarch64-linux-android/release/quartz
          
