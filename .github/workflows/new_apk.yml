name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Get code from repository
      uses: actions/checkout@v4

    # This auto-accepts all the software licenses so the download goes through
    - name: Accept Android Licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Set up Rust compiler
      run: rustup target add aarch64-linux-android

    # This runs the script from the main folder so it can find Cargo.toml
    - name: Find and run build script
      run: |
        SCRIPT_PATH=$(find . -name "build-android-arm64.sh" -print -quit)
        echo "Found script at: $SCRIPT_PATH"
        chmod +x "$SCRIPT_PATH"
        
        # 1. This fixes the features="${}" crash error automatically
        sed -i 's/features="${}"/features=""/g' "$SCRIPT_PATH"
        
        # 2. This forces the builder to drop Vulkan and use normal processing
        sed -i 's/cargo build/cargo build --no-default-features/g' "$SCRIPT_PATH"
        
        # 3. We run the script directly from the main folder instead of jumping into /scripts
        $SCRIPT_PATH
        
