name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Get code from your repository
      uses: actions/checkout@v4

    - name: Accept Android Licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Set up Rust compiler
      run: rustup target add aarch64-linux-android

    # 1. This downloads the missing official Saient app source code into a folder named "app-code"
    - name: Download App Source Code
      run: |
        git clone https://github.com app-code
        echo "Source code downloaded successfully."

    # 2. This automatically configures your script and runs it inside the source code folder
    - name: Find and run build script
      run: |
        SCRIPT_PATH=$(find . -name "build-android-arm64.sh" -not -path "*/app-code/*" -print -quit)
        echo "Found your script at: $SCRIPT_PATH"
        
        ABS_SCRIPT_PATH=$(realpath "$SCRIPT_PATH")
        
        # Repair the features="${}" typo in your script file automatically
        sed -i 's/features="${}"/features=""/g' "$ABS_SCRIPT_PATH"
        
        # Turn off Vulkan graphics inside your script automatically
        sed -i 's/cargo build/cargo build --no-default-features/g' "$ABS_SCRIPT_PATH"
        chmod +x "$ABS_SCRIPT_PATH"
        
        # Step inside the newly downloaded code folder where Cargo.toml lives
        cd app-code
        
        # Run the script to build your APK without Vulkan
        $ABS_SCRIPT_PATH
        
