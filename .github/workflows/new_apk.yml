name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Get code from your repository
      uses: actions/checkout@v4

    - name: Accept Android Licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Set up Rust compiler
      run: rustup target add aarch64-linux-android

    # 1. This downloads the CORRECT app code from the official Saient repository
    - name: Download Saient Quartz Source Code
      run: |
        git clone https://github.com quartz-source
        echo "Source code downloaded successfully."

    # 2. This fixes the typo error and builds using the official CPU setting (No Vulkan)
    - name: Find and run build script
      run: |
        SCRIPT_PATH=$(find . -name "build-android-arm64.sh" -not -path "*/quartz-source/*" -print -quit)
        echo "Found your script at: $SCRIPT_PATH"
        
        ABS_SCRIPT_PATH=$(realpath "$SCRIPT_PATH")
        
        # This clears out the features="${}" crash error automatically
        sed -i 's/features="${}"/features=""/g' "$ABS_SCRIPT_PATH"
        chmod +x "$ABS_SCRIPT_PATH"
        
        # We step inside the code folder
        cd quartz-source
        
        # We trigger your script but pass the custom rule telling it to drop Vulkan and use CPU
        export QUARTZ_ANDROID_FEATURES="cpu"
        $ABS_SCRIPT_PATH
        
