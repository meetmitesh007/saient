name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. This safely downloads the official Saient application source code first
    - name: Download Saient Source Code
      uses: actions/checkout@v4
      with:
        repository: 'SaientAI/saient'
        path: 'app-code'

    # 2. This safely downloads your personal script repository into a separate folder
    - name: Download Your Script
      uses: actions/checkout@v4
      with:
        path: 'my-script-folder'

    - name: Accept Android Licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Set up Rust compiler
      run: rustup target add aarch64-linux-android

    # 3. This automatically configures your script and runs it inside the source code folder
    - name: Find and run build script
      run: |
        SCRIPT_PATH=$(find ./my-script-folder -name "build-android-arm64.sh" -print -quit)
        echo "Found your script at: $SCRIPT_PATH"
        
        ABS_SCRIPT_PATH=$(realpath "$SCRIPT_PATH")
        
        # Repair the features="${}" typo in your script file automatically
        sed -i 's/features="${}"/features=""/g' "$ABS_SCRIPT_PATH"
        
        # Turn off Vulkan graphics inside your script automatically
        sed -i 's/cargo build/cargo build --no-default-features/g' "$ABS_SCRIPT_PATH"
        chmod +x "$ABS_SCRIPT_PATH"
        
        # Step inside the downloaded code folder where Cargo.toml lives
        cd app-code
        
        # Run the script to build your APK without Vulkan
        $ABS_SCRIPT_PATH
        
