name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. This downloads the CORRECT Saient Quartz application source code
    - name: Download Saient Quartz Source Code
      uses: actions/checkout@v4
      with:
        repository: 'SaientAI/saient-quartz'
        path: 'app-code'

    # 2. This safely downloads your personal script repository
    - name: Download Your Script
      uses: actions/checkout@v4
      with:
        path: 'my-script-folder'

    - name: Accept Android Licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Set up Rust compiler
      run: rustup target add aarch64-linux-android

    # 3. This runs the build inside the downloaded code folder using CPU instead of Vulkan
    - name: Find and run build script
      run: |
        SCRIPT_PATH=$(find ./my-script-folder -name "build-android-arm64.sh" -print -quit)
        echo "Found your script at: $SCRIPT_PATH"
        
        ABS_SCRIPT_PATH=$(realpath "$SCRIPT_PATH")
        
        # Repair the features="${}" typo in your script file automatically
        sed -i 's/features="${}"/features=""/g' "$ABS_SCRIPT_PATH"
        chmod +x "$ABS_SCRIPT_PATH"
        
        # Step inside the downloaded code folder where Cargo.toml lives
        cd app-code
        
        # Official setting to compile on CPU and ignore Vulkan graphics requirements
        export QUARTZ_ANDROID_FEATURES="cpu"
        
        # Trigger the script to build the app
        $ABS_SCRIPT_PATH
        
