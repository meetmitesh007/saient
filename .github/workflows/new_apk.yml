name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Get code from repository
      uses: actions/checkout@v4

    # This auto-accepts all the software licenses so the download goes through
    - name: Accept Android Licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Set up Rust compiler
      run: rustup target add aarch64-linux-android

    # This auto-detects where your code files are hidden and runs it there
    - name: Find and run build script
      run: |
        SCRIPT_PATH=$(find . -name "build-android-arm64.sh" -print -quit)
        CARGO_PATH=$(find . -name "Cargo.toml" -print -quit)
        
        echo "Found script at: $SCRIPT_PATH"
        echo "Found Cargo.toml at: $CARGO_PATH"
        
        if [ -z "$CARGO_PATH" ]; then
          echo "Error: Could not find Cargo.toml anywhere in the repository!"
          exit 1
        fi
        
        # Absolute path to the script
        ABS_SCRIPT_PATH=$(realpath "$SCRIPT_PATH")
        
        # 1. Fix the syntax error in the script automatically
        sed -i 's/features="${}"/features=""/g' "$ABS_SCRIPT_PATH"
        
        # 2. Force the builder to drop Vulkan and use normal processing
        sed -i 's/cargo build/cargo build --no-default-features/g' "$ABS_SCRIPT_PATH"
        
        # Make script executable
        chmod +x "$ABS_SCRIPT_PATH"
        
        # 3. Move directly into the folder where Cargo.toml is located and run the script
        cd $(dirname "$CARGO_PATH")
        $ABS_SCRIPT_PATH
        
