name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Get code from your repository
      uses: actions/checkout@v4

    - name: Accept Android Licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Set up Rust compiler
      run: rustup target add aarch64-linux-android

    # This steps inside the correct scripts folder and builds the app directly
    - name: Find and run build script
      run: |
        SCRIPT_PATH=$(find . -name "build-android-arm64.sh" -print -quit)
        echo "Found your script at: $SCRIPT_PATH"
        
        ABS_SCRIPT_PATH=$(realpath "$SCRIPT_PATH")
        
        # This clears out the features="${}" crash error automatically
        sed -i 's/features="${}"/features=""/g' "$ABS_SCRIPT_PATH"
        chmod +x "$ABS_SCRIPT_PATH"
        
        # We run the builder and tell it to use CPU processing instead of Vulkan graphics
        export QUARTZ_ANDROID_FEATURES="cpu"
        $ABS_SCRIPT_PATH
        
