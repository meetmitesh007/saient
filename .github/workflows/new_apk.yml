name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Download Saient Quartz Source Code
      uses: actions/checkout@v4
      with:
        repository: 'SaientAI/saient-quartz'
        path: 'app-code'

    - name: Download Your Script
      uses: actions/checkout@v4
      with:
        path: 'my-script-folder'

    - name: Accept Android Licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Set up Rust compiler
      run: rustup target add aarch64-linux-android

    - name: Find and run build script
      run: |
        SCRIPT_PATH=$(find ./my-script-folder -name "build-android-arm64.sh" -print -quit)
        echo "Found your script at: $SCRIPT_PATH"
        
        ABS_SCRIPT_PATH=$(realpath "$SCRIPT_PATH")
        
        sed -i 's/features="${}"/features=""/g' "$ABS_SCRIPT_PATH"
        chmod +x "$ABS_SCRIPT_PATH"
        
        cd app-code
        export QUARTZ_ANDROID_FEATURES="cpu"
        $ABS_SCRIPT_PATH

    # This new step packages the built file up so you can download it to your phone
    - name: Upload Completed App File
      uses: actions/upload-artifact@v4
      with:
        name: no-vulkan-app-build
        path: |
          app-code/target/aarch64-linux-android/release/
          app-code/target/release/
          
