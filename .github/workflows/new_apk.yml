name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Download Saient Quartz Source Code
      uses: actions/checkout@v4
      with:
        repository: 'SaientAI/saient-quartz'
        path: 'app-code'

    - name: Download Your Script
      uses: actions/checkout@v4
      with:
        path: 'my-script-folder'

    - name: Accept Android Licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

    # This steps downloads the exact platform and build tools needed for Android 33
    - name: Install Missing Android Platform and Build Tools 33
      run: |
        ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2"

    - name: Set up Rust compiler
      run: rustup target add aarch64-linux-android

    - name: Install Android Packaging Tool
      run: cargo install cargo-apk

    - name: Find and run build script
      run: |
        SCRIPT_PATH=$(find ./my-script-folder -name "build-android-arm64.sh" -print -quit)
        echo "Found your script at: $SCRIPT_PATH"
        
        ABS_SCRIPT_PATH=$(realpath "$SCRIPT_PATH")
        
        sed -i 's/features="${}"/features=""/g' "$ABS_SCRIPT_PATH"
        
        # This replaces the raw build command with the APK packager command
        sed -i 's/cargo build/cargo apk build --no-default-features/g' "$ABS_SCRIPT_PATH"
        chmod +x "$ABS_SCRIPT_PATH"
        
        cd app-code
        export QUARTZ_ANDROID_FEATURES="cpu"
        $ABS_SCRIPT_PATH

    - name: Upload Completed APK Installation File
      uses: actions/upload-artifact@v4
      with:
        name: no-vulkan-installer-apk
        path: |
          app-code/target/aarch64-linux-android/release/apk/*.apk
          app-code/target/aarch64-linux-android/debug/apk/*.apk
          app-code/target/release/apk/*.apk
          app-code/target/debug/apk/*.apk
          
