name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Get code from repository
      uses: actions/checkout@v4

    - name: Accept Android Licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Set up Rust compiler
      run: rustup target add aarch64-linux-android

    # This updated step will search your entire repository for the script file and run it
    - name: Find and run build script
      run: |
        SCRIPT_PATH=$(find . -name "build-android-arm64.sh" -print -quit)
        if [ -z "$SCRIPT_PATH" ]; then
          echo "Error: The script file build-android-arm64.sh was not found anywhere in the repository!"
          exit 1
        fi
        echo "Found script at: $SCRIPT_PATH"
        chmod +x "$SCRIPT_PATH"
        cd $(dirname "$SCRIPT_PATH")
        ./build-android-arm64.sh --no-default-features
        
