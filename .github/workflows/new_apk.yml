name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Get code from repository
      uses: actions/checkout@v4

    # This auto-accepts all the software licenses so the download goes through
    - name: Accept Android Licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Set up Rust compiler
      run: rustup target add aarch64-linux-android

    # This fixes the script typo automatically and runs the build without Vulkan
    - name: Find and run build script
      run: |
        SCRIPT_PATH=$(find . -name "build-android-arm64.sh" -print -quit)
        echo "Found script at: $SCRIPT_PATH"
        chmod +x "$SCRIPT_PATH"
        cd $(dirname "$SCRIPT_PATH")
        
        # 1. This automatically changes features="${}" to features="" to fix the crash
        sed -i 's/features="${}"/features=""/g' build-android-arm64.sh
        
        # 2. This forces the builder to drop Vulkan and use normal processing
        sed -i 's/cargo build/cargo build --no-default-features/g' build-android-arm64.sh
        
        ./build-android-arm64.sh
        
