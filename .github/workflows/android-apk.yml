name: Build Android Visual App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Download App Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Accept Android SDK Licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

    # This steps prepares the script to build a test APK instead of a locked store file
    - name: Prepare and Run App Compiler
      run: |
        SCRIPT_PATH=$(find . -name "build-android-release.sh" -print -quit)
        echo "Found your script at: $SCRIPT_PATH"
        
        ABS_SCRIPT_PATH=$(realpath "$SCRIPT_PATH")
        chmod +x "$ABS_SCRIPT_PATH"
        
        # 1. We force the app script to allow building test/debug APKs
        sed -i 's/exit 2/# exit 2/g' "$ABS_SCRIPT_PATH"
        sed -i 's/exit 4/# exit 4/g' "$ABS_SCRIPT_PATH"
        sed -i 's/exit 5/# exit 5/g' "$ABS_SCRIPT_PATH"
        
        # 2. We skip strict security checks so it can complete on GitHub
        export SAIENT_ALLOW_DEBUG_RELEASE="true"
        export SAIENT_SKIP_NPM_CI="false"
        
        # 3. Disable Vulkan requirements across background engines
        export QUARTZ_ANDROID_FEATURES="cpu"
        
        # Run the build script
        $ABS_SCRIPT_PATH

    # This searches for the newly created .apk file inside the generated build folder and saves it
    - name: Upload Finished Visual Installer APK
      uses: actions/upload-artifact@v4
      with:
        name: saient-visual-app
        path: "android/app/build/outputs/apk/release/*.apk"
        
