name: Build Android Visual App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Download App Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Accept Android SDK Licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Install Application Dependencies
      run: |
        npm install --legacy-peer-deps

    # 1. This converts the Expo project into a native Android app folder without health checks
    - name: Run Expo Prebuild
      run: |
        npx expo prebuild --clean --platform android --no-install

    # 2. This compiles the visual APK package directly using the CPU configuration
    - name: Run Native Android Compiler
      env:
        QUARTZ_ANDROID_FEATURES: "cpu"
      run: |
        cd android
        chmod +x gradlew
        ./gradlew :app:clean :app:assembleRelease

    # 3. This saves your finished installable .apk application file
    - name: Upload Finished Visual Installer APK
      uses: actions/upload-artifact@v4
      with:
        name: saient-visual-app
        path: |
          android/app/build/outputs/apk/release/*.apk
          android/app/build/outputs/apk/debug/*.apk
          
